<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-300">
    <div class="w-full flex flex-col justify-center items-center gap-y-10 p-10">
        <div class="bg-gray-200 text-gray-800 p-4 w-1/3 text-center rounded-lg flex flex-col gap-y-2">
            <h1 class="text-xl font-bold">Atividade 3</h1>
            <h2 class="text-lg font-semibold">Listas</h2>
        </div>
        <div class="bg-gray-200 text-gray-800 p-4 w-1/3 rounded-lg flex flex-col gap-y-4">
            <label for="materiais">Lista Comum</label>
            <hr>
            <ul name="materiais" id="ul_common" class="list-disc pl-5">
                <li>Item 1</li>
                <li>Item 2</li>
            </ul>
        </div>
        <div class="bg-gray-200 text-gray-800 p-4 w-1/3 rounded-lg flex flex-col gap-y-4">
            <label for="materiais">Materiais Escolares</label>
            <hr>
            <ul name="materiais" id="ul_materiais" class="list-disc pl-5">
                <li>Lápis</li>
                <li>Borracha</li>
                <li>Caneta</li>
            </ul>
        </div>
        <div class="bg-gray-200 text-gray-800 p-4 w-1/3 rounded-lg flex flex-col gap-y-4">
            <label for="materiais">Gêneros Literários</label>
            <hr>
            <ul name="materiais" id="ul_generos" class="list-disc pl-5">
                <li>Romance</li>
                <li>Thriller</li>
                <li>Ficção Científica</li>
            </ul>
        </div>
        <div class="bg-gray-200 text-gray-800 p-4 w-1/3 rounded-lg flex flex-col gap-y-4">
            <label for="tutorial">Como Fazer Bolo?</label>
            <hr>
            <ol id="ol_tutorial" type="1" start="5" class="list-decimal pl-5">
                <li>Pegue os ingredientes</li>
                <li>Misture</li>
                <li>Coloque no Forno</li>
            </ol>
        </div>
    </div>

</body>
</html>
